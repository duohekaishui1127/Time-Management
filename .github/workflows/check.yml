name: Check levels and progression
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - name: Check release config on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: node tools/check-release.js
